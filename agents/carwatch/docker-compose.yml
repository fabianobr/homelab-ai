services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: carwatch
      POSTGRES_PASSWORD: carwatch
      POSTGRES_DB: carwatch
    volumes:
      - carwatch_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwatch -d carwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # `.env` is gitignored, so a fresh clone only has `.env.example`. Without
    # `required: false` even `docker compose config` fails there.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://carwatch:carwatch@db:5432/carwatch
      HOME: /app/data
    # Run as the host user (uid/gid 1000, the only interactive account on the
    # homelab host) instead of root. The image is built and its deps installed
    # as root, but site-packages and the `carwatch` entrypoint are
    # world-readable/executable, so a non-root uid runs it fine -- and it stops
    # `./data` (bind mount below) and everything written to it (`feed.atom`)
    # from being created root-owned every `docker compose run`, which then
    # needs an interactive `sudo chown` no automated weekly-run can do.
    # `HOME=/app/data` above keeps any library that writes under $HOME (uid
    # 1000 has no /etc/passwd entry, so $HOME would otherwise be `/`) on the
    # one writable, persistent path.
    user: "1000:1000"
    # `docker compose run --rm app ...` (used by both `publish` and the
    # weekly-run cron via run.sh) destroys the container's filesystem the
    # moment the command exits. Without this mount, `feed.atom` was written
    # inside that throwaway filesystem and never reached the host at all --
    # nginx or any static host serving SPEC.md's "servido por nginx ou
    # qualquer static host" would have nothing to read, forever, no matter
    # how many weekly-run cycles executed.
    volumes:
      - ./data:/app/data

volumes:
  carwatch_db_data:

[project]
name = "carwatch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary,pool]>=3.2,<4.0",
    "httpx[http2]>=0.27,<0.28",
    "tenacity>=9.0,<10.0",
    "feedparser>=6.0,<7.0",
    "selectolax>=0.3,<0.4",
    "pydantic-settings>=2.0,<3.0",
    "structlog>=24.0,<25.0",
    "anthropic>=0.40,<0.41",
    "typer>=0.12,<0.13",
    "pyyaml>=6.0,<7.0",
    # typer 0.12.x's rich-powered --help formatting (typer/rich_utils.py)
    # calls Parameter.make_metavar() with no `ctx` argument; click 8.2 made
    # that argument required, so any click>=8.2 crashes every `--help`
    # invocation with TypeError. typer 0.12.5's own metadata only declares
    # `click>=8.0.0` (no upper bound), so this must be pinned here instead.
    # Fixed upstream in later typer releases; revisit if typer is ever
    # bumped past 0.13.
    "click>=8.1,<8.2",
    "sentence-transformers>=3.0,<4.0",
]

[project.scripts]
carwatch = "carwatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "respx>=0.21,<0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carwatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "embeddings: marks tests for multilingual embeddings (deselect with '-m \"not embeddings\"')",
]

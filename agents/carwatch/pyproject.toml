[project]
name = "carwatch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary,pool]>=3.2,<4.0",
    "httpx[http2]>=0.27,<0.28",
    "tenacity>=9.0,<10.0",
    "feedparser>=6.0,<7.0",
    "selectolax>=0.3,<0.4",
    "pydantic-settings>=2.0,<3.0",
    "structlog>=24.0,<25.0",
    "anthropic>=0.40,<0.41",
    "typer>=0.12,<0.13",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
carwatch = "carwatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "respx>=0.21,<0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carwatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

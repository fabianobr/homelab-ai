ollama_url: "http://localhost:11434"
# Modelos são aceitos somente por nome/tag exatos e tentados nesta ordem.
# O limite de 2 tentativas evita manter a GPU ocupada durante toda a janela do timer.
ollama_model: "qwen3:14b"
ollama_fallback_models:
  - "qwen3:8b"
  - "llama3.2:latest"
ollama_max_attempts: 2
ollama_timeout_seconds: 240
ollama_options:
  temperature: 0.2
  num_ctx: 8192
  num_predict: 1536
searxng_url: "http://localhost:8080"
backlog_path: "../../research/sdlc-agentico/backlog.md"
reports_dir: "./reports"
log_file: "./research.log"

search_queries:
  - "local LLM agentic coding 2026 new tool"
  - "ollama coding agent open source 2026"
  - "self-hosted AI software development pipeline 2026"
  - "local LLM SDLC automation open source"
  - "xda developers local AI agent coding 2026"
  - "OpenCode Aider OpenHands update 2026"
  - "CrewAI LangGraph ollama local 2026"

hardware_context: "RTX 5060 Ti 16GB VRAM, 32GB RAM. Roda modelos até 14B Q4 confortavelmente, ~24B Q4_K_M apertado (13GB). 1 GPU = sem paralelismo de inferência."

known_discarded:
  - "Cline"
  - "Continue.dev"

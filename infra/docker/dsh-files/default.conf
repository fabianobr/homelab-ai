server {
    listen 8080;
    server_name _;
    charset utf-8;
    source_charset utf-8;

    # Todos os endpoints ficam sob /files/ porque o Cloudflare Tunnel só roteia
    # esse prefixo para este serviço (^/files($|/.*)). Fora dele, o hostname cai
    # no DSH web.

    # Estado interno do DSH — bloqueado em qualquer prefixo.
    location ~* /(workspace\.json|session_projcache\.json)$ {
        return 404;
    }

    # Listagem em JSON, consumida pelo index.html (ordena e formata no cliente).
    location /files/_ls/ {
        alias /srv/files/;
        autoindex on;
        autoindex_format json;
    }

    # Conteúdo cru: abrir/baixar um arquivo.
    location /files/_raw/ {
        alias /srv/files/;
        autoindex off;
    }

    # Qualquer path de navegação (/files/, /files/subdir/…) devolve a SPA;
    # ela lê o path da URL e pede a listagem correspondente a /files/_ls/.
    location /files/ {
        root /srv/app;
        try_files /index.html =404;
    }

    # Acesso local direto (127.0.0.1:3082) sem o prefixo.
    location = / {
        return 302 /files/;
    }
}

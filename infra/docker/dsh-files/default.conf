server {
    listen 8080;
    server_name _;
    charset utf-8;
    source_charset utf-8;
    absolute_redirect off;

    # Todos os endpoints ficam sob /files/ porque o Cloudflare Tunnel só roteia
    # esse prefixo para este serviço (^/files($|/.*)). Fora dele, o hostname cai
    # no DSH web.

    # Estado interno do DSH no nível raiz do storages — nunca servir o conteúdo.
    # Match exato: não pega arquivos de mesmo nome dentro de subprojetos gerados.
    location = /files/_raw/workspace.json { return 404; }
    location = /files/_raw/session_projcache.json { return 404; }

    # Listagem em JSON, consumida pelo index.html (ordena e formata no cliente;
    # o index.html também esconde workspace.json/session_projcache.json da lista).
    location /files/_ls/ {
        alias /srv/files/;
        autoindex on;
        autoindex_format json;
    }

    # Conteúdo cru. É saída de LLM servida na MESMA origem do DSH web (mesmo
    # hostname/Access), então trava a superfície de XSS armazenado:
    #  - CSP sandbox: sem script, sem plugin, sem acesso same-origin; HTML/CSS
    #    ainda renderiza inline (o caso de uso é ver o arquivo);
    #  - nosniff: sem content-type sniffing.
    location /files/_raw/ {
        alias /srv/files/;
        autoindex off;
        add_header Content-Security-Policy "sandbox allow-downloads" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # /files sem barra -> a SPA (o cloudflared roteia bare /files pra cá).
    location = /files { return 302 /files/; }

    # Qualquer path de navegação (/files/, /files/subdir/…) devolve a SPA;
    # ela lê o path da URL e pede a listagem correspondente a /files/_ls/.
    location /files/ {
        root /srv/app;
        try_files /index.html =404;
    }

    # Acesso local direto (127.0.0.1:3082) sem o prefixo.
    location = / {
        return 302 /files/;
    }
}

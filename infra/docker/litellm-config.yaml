# LiteLLM gateway para o pipeline SDLC híbrido (n8n + Claude + Ollama)
#
# Roteamento por papel SDLC:
#   sdlc-discovery  → Claude Sonnet (alta ambiguidade, julgamento)
#   sdlc-review     → Claude Sonnet (qualidade, compliance)
#   sdlc-codegen    → qwen3-coder:30b (lógica de negócio, SWE-bench 69.6%)
#   sdlc-test       → qwen2.5-coder:32b (geração de testes com ACs explícitos)
#   sdlc-fix        → qwen3:14b thinking (debug local, fallback → Claude se travar)
#   groq-fast-public → Qwen 3.6 27B sem reasoning (somente dados públicos,
#                      fallback → qwen3.5 local 9.7B)
#
# Subir: docker compose --profile optional up -d litellm
# Smoke test: curl http://localhost:4000/health

model_list:
  - model_name: sdlc-discovery
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: sdlc-review
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: sdlc-codegen
    litellm_params:
      model: ollama/qwen3-coder:30b
      api_base: http://ollama:11434

  - model_name: sdlc-test
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: http://ollama:11434

  - model_name: sdlc-fix
    litellm_params:
      model: ollama/qwen3:14b
      api_base: http://ollama:11434

  # Opt-in somente: nenhum workflow existente seleciona este alias.
  # DeepSeek V4 Flash (284B) servido pelo Colibrì NO HOST, não neste compose:
  # o engine é compilado com CUDA/DeepGEMM para sm_120. Sobe sob demanda com
  # `infra/scripts/colibri-serve.sh start`; com ele parado esta rota devolve
  # erro de conexão, o que é o comportamento desejado.
  #
  # timeout alto de propósito: medido neste host, um prompt de 4.575 tokens
  # custa ~223 s só de prefill. O default do LiteLLM mataria a requisição.
  # Ver docs/colibri.md.
  - model_name: sdlc-review-local
    litellm_params:
      model: openai/deepseek-v4
      api_base: http://host.docker.internal:5000/v1
      api_key: os.environ/COLI_API_KEY
      timeout: 2400
      stream_timeout: 2400

  - model_name: groq-fast-public
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      api_key: os.environ/GROQ_API_KEY
      reasoning_effort: none
      temperature: 0.7
      top_p: 0.8

  - model_name: groq-fast-public-local
    litellm_params:
      model: ollama/qwen3.5:latest
      api_base: http://ollama:11434

litellm_settings:
  # Se o fix local falhar/exceder timeout, escala para Claude
  fallbacks:
    - sdlc-fix:
        - sdlc-review
    - groq-fast-public:
        - groq-fast-public-local
  num_retries: 2
  request_timeout: 600
  # Para habilitar tracking de custo via Langfuse (ver backlog):
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]

guardrails:
  - guardrail_name: public-data-only
    litellm_params:
      guardrail: public_prompt_guardrail.PublicPromptGuardrail
      mode: pre_call
      default_on: true

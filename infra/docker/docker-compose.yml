services:
  ollama:
    image: ollama/ollama:0.32.15
    container_name: ollama
    profiles:
      - media-pipeline
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ${OLLAMA_DATA_DIR:?set OLLAMA_DATA_DIR in .env}:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=300s        # solta a VRAM rápido quando ocioso (libera p/ ComfyUI); node OllamaFlushVRAM é a garantia explícita
      # Agentes com ferramentas precisam de contexto amplo; q8 reduz o cache KV
      # pela metade e paralelismo 1 impede multiplicar esse custo na GPU de 16 GiB.
      - OLLAMA_CONTEXT_LENGTH=65536
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_NUM_PARALLEL=1
      # - OLLAMA_MAX_LOADED_MODELS=1  # 1 modelo na VRAM por vez (evita transbordo pra CPU com ComfyUI compartilhando)
    # GPU via CDI (nvidia.com/gpu=all) em vez do runtime nvidia legado.
    # O runtime legado injeta regras de cgroup pela nvidia-container-cli que o
    # systemd remove em qualquer `daemon-reload`, derrubando o acesso à GPU
    # (NVML "Unknown Error" -> fallback pra CPU). CDI usa o caminho OCI nativo
    # do runc, que sobrevive a reloads. Spec mantido por nvidia-cdi-refresh.service.
    devices:
      - "nvidia.com/gpu=all"
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 25g
        reservations:
          memory: 2g

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
    container_name: open-webui
    profiles:
      - interactive
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - WEBUI_NAME=Home Lab AI
      - ENABLE_SIGNUP=false
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=Cf-Access-Authenticated-User-Email
      - ENABLE_OPENAI_API=True
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://ollama:11434/v1
      - OPENAI_API_KEY=ollama
      - ENABLE_API_KEY=true
      - RAG_EMBEDDING_ENGINE=ollama                  # embeddings na GPU via Ollama (não na CPU local)
      - RAG_OLLAMA_BASE_URL=http://ollama:11434
      - RAG_EMBEDDING_MODEL=nomic-embed-text
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
        reservations:
          memory: 512m

  comfyui:
    profiles:
      - media-pipeline
    build:
      context: ${COMFYUI_SOURCE_DIR:?set COMFYUI_SOURCE_DIR in .env}
      dockerfile: ${HOMELAB_ROOT:?set HOMELAB_ROOT in .env}/infra/docker/comfyui/Dockerfile
    container_name: comfyui
    restart: unless-stopped
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--disable-cuda-malloc"]
    # GPU via CDI — ver comentário no serviço ollama. Evita perda de GPU em daemon-reload.
    devices:
      - "nvidia.com/gpu=all"
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - ${COMFYUI_SOURCE_DIR:?set COMFYUI_SOURCE_DIR in .env}:/comfyui
      # /mnt/models: destino real de vários symlinks dentro de models/ (vae, diffusion_models,
      # text_encoders, loras). Sem esse mount os symlinks ficam quebrados dentro do container.
      - /mnt/models:/mnt/models
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Pico observado do workflow LTX (encoder Gemma3-12B + LTXAV offloadados)
    # é ~27GB combinado RAM+CUDA pinned (confirmado via docker events "oom" +
    # exitCode=137 em 2026-08-02 com o teto de 22g/24g — matava o ComfyUI a
    # cada execução desse workflow). memswap_limit é o total combinado de
    # RAM + swap do container; mantido finito (29g, não -1/ilimitado) porque
    # swap ilimitado já disparou o systemd-oomd contra a sessão gráfica do
    # host antes.
    memswap_limit: 29g
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 27g
        reservations:
          memory: 2g

  n8n:
    build:
      context: ./n8n
    image: homelab-ai/n8n-ytdlp:latest
    container_name: n8n
    profiles:
      - optional
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n:/home/node/.n8n
      # Relatórios do pipeline agents/youtube-etl; dar permissão ao uid 1000 (usuário node)
      - ${HOMELAB_ROOT:?set HOMELAB_ROOT in .env}/agents/youtube-etl/reports:/data/youtube-etl/reports
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - TZ=${TZ:-Etc/UTC}
      # Necessário para Code nodes lerem $env.* (ex.: agents/youtube-etl); nome da flag
      # mudou de N8N_BLOCK_ENV_ACCESS_IN_NODE_JS para N8N_BLOCK_ENV_ACCESS_IN_NODE.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Default do n8n restringe nós Read/Write File a ~/.n8n-files; libera
      # explicitamente o volume de relatórios do agents/youtube-etl.
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/youtube-etl/reports
      # n8n desabilita o nó Execute Command por padrão desde a v2 (hardening).
      # Reabilitado porque agents/youtube-etl usa yt-dlp via Execute Command —
      # é workflow nosso versionado no repo, não carga de terceiro.
      - NODES_EXCLUDE=[]
      # Pipeline agents/youtube-etl — valores reais só no .env untracked
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:5678/healthz || wget -q --spider http://127.0.0.1:5678/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 256m

  litellm:
    # v1.97.0 validado em 2026-08-23; digest evita mudança silenciosa da tag.
    image: ghcr.io/berriai/litellm:v1.97.0@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
    container_name: litellm
    profiles:
      - optional
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - ./public_prompt_guardrail.py:/app/public_prompt_guardrail.py:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Valor real somente no .env ignorado pelo Git. A rota continua opcional.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /health faz health profundo dos backends e pode acordar modelos Ollama.
      # A raiz valida só que o proxy HTTP está respondendo.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
        reservations:
          memory: 512m

  searxng:
    # Digest da imagem 2026.8.22-9fea41204 validada em 2026-08-23;
    # atualizar deliberadamente, não via :latest.
    image: searxng/searxng:latest@sha256:11a9b34cdc0b1ec2b991470a2762ecb5a1a531898289fb51dcd015260450729e
    container_name: searxng
    profiles:
      - optional
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      - SEARXNG_BASE_URL=http://localhost:8080/
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 256m

  # DSH escuta somente em 127.0.0.1 dentro do seu namespace. O relay abaixo
  # compartilha a rede do serviço e publica apenas um alvo loopback no host
  # para o Cloudflare Tunnel; não use network_mode: host nem --host 0.0.0.0.
  deepseek-harness:
    build:
      context: ./deepseek-harness
      args:
        DSH_VERSION: "0.1.0-rc.7"
    image: homelab-ai/deepseek-harness:0.1.0-rc.7
    container_name: deepseek-harness
    profiles:
      - harness
    restart: unless-stopped
    ports:
      - "127.0.0.1:3081:8080"
    volumes:
      - deepseek-harness-state:/dsh-home
      - deepseek-harness-npm-cache:/dsh-home/.npm
      - ${DSH_WORKSPACE_DIR:-/srv/homelab-ai/dsh-workspaces}:/workspace
    environment:
      - DSH_PERMISSION_MODE=workspace-write
      - DSH_TELEMETRY_DISABLED=1
    command:
      [
        "node",
        # Necessário pelo serviço HMR incluído no profile web do DSH 0.1.0-rc.7.
        "--expose-internals",
        "/usr/local/lib/node_modules/@deepseek-ai/dsh/lib/bin.js",
        "web",
        "--no-open",
        "--port",
        "3080",
        "--trusted-host",
        "${DSH_PUBLIC_HOSTNAME:-dsh.example.com}",
      ]
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3080').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
        reservations:
          memory: 512m

  deepseek-harness-relay:
    image: homelab-ai/deepseek-harness:0.1.0-rc.7
    pull_policy: never
    container_name: deepseek-harness-relay
    profiles:
      - harness
    restart: unless-stopped
    depends_on:
      - deepseek-harness
    network_mode: service:deepseek-harness
    command: ["node", "/usr/local/lib/deepseek-harness/relay.mjs"]
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  deepseek-harness-state:
    name: deepseek-harness-state
  deepseek-harness-npm-cache:
    name: deepseek-harness-npm-cache
  open-webui:
    name: open-webui
    external: true
  n8n:
